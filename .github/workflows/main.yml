name: Build APK

on:
  push:
    # This repo's default branch is master; the previous `main` filter meant
    # the workflow never ran.
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      # Keys are injected at build time rather than committed. Configure these
      # as repository secrets; the build still succeeds without them, with the
      # maps and Gemini features disabled.
      - name: Write dart-defines
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '{"GOOGLE_MAPS_API_KEY":"%s","GEMINI_API_KEY":"%s"}\n' \
            "$GOOGLE_MAPS_API_KEY" "$GEMINI_API_KEY" > dart_defines.json

      # Split per ABI: a universal APK is ~105MB because the LiteRT, ML Kit and
      # Flutter native libraries are duplicated across three architectures.
      # Per-ABI builds are roughly a third of that each.
      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=dart_defines.json

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
